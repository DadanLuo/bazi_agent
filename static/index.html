<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赛博司命</title>
<style>
:root{
  --bg:#f3ecdf;--paper:#fffaf3;--paper-soft:rgba(255,250,243,.82);--ink:#22343a;--muted:#69726d;
  --accent:#b35639;--accent-deep:#8d4028;--blue:#446a79;--green:#4f6859;--red:#a34541;
  --line:rgba(34,52,58,.12);--shadow:0 22px 54px rgba(52,47,40,.11);--radius:22px;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
  --sans:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;font-family:var(--sans);color:var(--ink);
  background:
    radial-gradient(circle at top left, rgba(179,86,57,.14), transparent 32%),
    radial-gradient(circle at right, rgba(68,106,121,.1), transparent 26%),
    linear-gradient(180deg,#faf5ed 0%,#f3ecdf 50%,#eadfca 100%);
}
.page{max-width:1420px;margin:0 auto;padding:24px 18px 34px}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:20px 24px;margin-bottom:18px;background:var(--paper-soft);border:1px solid var(--line);
  border-radius:24px;box-shadow:var(--shadow);backdrop-filter:blur(12px)
}
.brand h1{font:700 2rem/1.1 var(--serif);letter-spacing:.08em}
.brand p{margin-top:6px;color:var(--muted);font-size:.9rem}
.top-tabs{display:flex;gap:10px}
.top-tab{
  border:none;background:rgba(34,52,58,.06);color:var(--ink);padding:10px 18px;border-radius:999px;
  font-weight:700;font-size:.9rem;cursor:pointer;transition:.18s ease
}
.top-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fffaf4;box-shadow:0 14px 28px rgba(179,86,57,.24)}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px}
.card{
  background:var(--paper-soft);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);backdrop-filter:blur(12px)
}
.panel,.result{padding:22px}
.panel-head,.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.panel-head h2,.result-head h2{font:700 1.18rem/1.2 var(--serif)}
.mode-switch{display:flex;gap:8px;margin-bottom:16px}
.mode-btn{
  flex:1;border:none;padding:10px 12px;border-radius:14px;font-weight:700;cursor:pointer;
  background:rgba(34,52,58,.06);color:var(--ink)
}
.mode-btn.active{background:rgba(179,86,57,.12);color:var(--accent)}
.stack{display:grid;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;color:var(--muted);font-size:.82rem;margin-bottom:6px}
input,select,textarea{
  width:100%;border:1px solid rgba(34,52,58,.12);border-radius:14px;padding:12px 14px;
  background:rgba(255,255,255,.74);color:var(--ink);font-size:.95rem;font-family:inherit
}
textarea{min-height:126px;resize:vertical}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:rgba(179,86,57,.42);box-shadow:0 0 0 4px rgba(179,86,57,.1)
}
.hidden{display:none!important}
.submit{
  width:100%;margin-top:16px;border:none;border-radius:16px;padding:14px 16px;cursor:pointer;
  font-weight:700;font-size:.96rem;color:#fffaf4;background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  box-shadow:0 16px 30px rgba(179,86,57,.24)
}
.status,.error{
  display:none;margin-top:14px;padding:14px;border-radius:16px;font-size:.88rem;line-height:1.7
}
.status.active{display:block;background:rgba(68,106,121,.09);border:1px solid rgba(68,106,121,.14);color:var(--blue)}
.error.active{display:block;background:rgba(163,69,65,.1);border:1px solid rgba(163,69,65,.16);color:var(--red)}
.track{height:8px;border-radius:999px;background:rgba(68,106,121,.12);overflow:hidden;margin:10px 0 12px}
.fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--accent));transition:width .4s ease}
.steps{display:grid;gap:6px;font-size:.82rem;color:var(--muted)}
.steps .active{color:var(--accent);font-weight:700}
.steps .done{color:var(--green)}
.placeholder{
  min-height:620px;display:grid;place-items:center;text-align:center;padding:30px
}
.placeholder .mark{
  width:78px;height:78px;margin:0 auto 16px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(179,86,57,.15),rgba(68,106,121,.12));color:var(--accent);font:700 1.8rem var(--serif)
}
.placeholder h2{font:700 1.34rem var(--serif);margin-bottom:10px}
.placeholder p{color:var(--muted);line-height:1.85}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.summary-item{padding:14px 16px;border-radius:18px;background:var(--paper);border:1px solid rgba(34,52,58,.08)}
.summary-item span{display:block;color:var(--muted);font-size:.78rem;margin-bottom:8px}
.summary-item strong{display:block;font:700 1.08rem/1.35 var(--serif)}
.summary-item em{display:block;margin-top:8px;color:var(--muted);font-style:normal;font-size:.78rem;line-height:1.6}
.inline-note{margin-bottom:16px;padding:12px 14px;border-radius:16px;background:rgba(179,86,57,.08);border:1px solid rgba(179,86,57,.14);font-size:.88rem;line-height:1.75}
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pillar{
  padding:16px 12px;border-radius:20px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.74),rgba(255,255,255,.34)),linear-gradient(135deg,rgba(179,86,57,.12),rgba(68,106,121,.08));
  border:1px solid rgba(179,86,57,.12)
}
.pillar small{display:block;color:var(--muted);font-size:.8rem;margin-bottom:8px}
.pillar strong,.pillar span{display:block;font:700 1.75rem/1.2 var(--serif)}
.pillar span{color:var(--accent)}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(34,52,58,.14),transparent);margin:18px 0}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{padding:18px;border-radius:20px;background:var(--paper);border:1px solid rgba(34,52,58,.08)}
.box h3{font:700 1rem var(--serif);margin-bottom:12px}
.bars{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:32px 1fr 48px;gap:10px;align-items:center}
.bar-track{height:12px;border-radius:999px;background:rgba(34,52,58,.08);overflow:hidden}
.bar-fill{height:100%;border-radius:999px}
.mu{background:#6f9b6e}.huo{background:#cf6b4e}.tu{background:#c5a05f}.jin{background:#859aa7}.shui{background:#4b7ea3}
.list{display:grid;gap:12px}
.list-item{padding:14px 16px;border-radius:16px;background:rgba(34,52,58,.04)}
.list-item strong{display:block;margin-bottom:8px}
.list-item p,.mini p,.rag-item p,.tarot-card p{color:var(--muted);line-height:1.8;font-size:.9rem}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tag{display:inline-flex;padding:7px 12px;border-radius:999px;font-size:.82rem;font-weight:700}
.good{background:rgba(79,104,89,.12);color:var(--green)}
.bad{background:rgba(163,69,65,.1);color:var(--red)}
.info{background:rgba(34,52,58,.04);padding:14px 16px;border-radius:16px}
.report{padding:18px;border-radius:20px;background:#fffdf8;border:1px solid rgba(34,52,58,.08);line-height:1.9;max-height:520px;overflow:auto}
.report h1,.report h2,.report h3{font-family:var(--serif);color:var(--accent-deep);margin:14px 0 10px}
.report p{margin-bottom:10px}
.rag-wrap{display:grid;gap:10px}
.rag-status{display:inline-flex;padding:8px 12px;border-radius:999px;font-size:.8rem;font-weight:700;margin-bottom:4px}
.rag-ok{background:rgba(79,104,89,.12);color:var(--green)}
.rag-skip{background:rgba(68,106,121,.1);color:var(--blue)}
.rag-bad{background:rgba(163,69,65,.1);color:var(--red)}
.rag-item{padding:14px;border-radius:18px;background:var(--paper);border:1px solid rgba(34,52,58,.08)}
.rag-query{border-left:4px solid rgba(179,86,57,.55)}
.score{margin-top:10px}
.score-row{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:6px}
.score-track{height:8px;border-radius:999px;background:rgba(34,52,58,.08);overflow:hidden}
.score-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#c89f54)}
.tarot-headline{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.tarot-headline h2{font:700 1.2rem var(--serif)}
.tarot-headline span{color:var(--muted);font-size:.88rem}
.tarot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.tarot-card{padding:16px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.76),rgba(255,255,255,.32));border:1px solid rgba(34,52,58,.08)}
.tarot-card strong{display:block;font:700 1.04rem var(--serif);margin-bottom:4px}
.tarot-card small{display:block;color:var(--muted);font-size:.78rem;margin-bottom:8px}
.ori{display:inline-flex;padding:5px 10px;border-radius:999px;font-size:.74rem;font-weight:700;margin-bottom:10px}
.upright{background:rgba(79,104,89,.12);color:var(--green)}
.reversed{background:rgba(163,69,65,.1);color:var(--red)}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.kw span{padding:4px 8px;border-radius:999px;background:rgba(68,106,121,.08);font-size:.74rem;color:var(--ink)}
.followup{margin-top:18px}
.thread{display:grid;gap:10px;max-height:240px;overflow:auto;margin-bottom:12px}
.bubble{padding:12px 14px;border-radius:16px;line-height:1.75;font-size:.88rem}
.bubble.user{background:rgba(179,86,57,.1);margin-left:28px}
.bubble.assistant{background:rgba(34,52,58,.05);margin-right:28px}
.follow-row{display:grid;grid-template-columns:1fr auto;gap:10px}
.follow-row textarea{min-height:54px}
.send-btn{border:none;border-radius:14px;padding:0 16px;background:rgba(34,52,58,.08);color:var(--ink);font-weight:700;cursor:pointer}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
@media (max-width:1100px){.layout,.two-col{grid-template-columns:1fr}.summary,.pillars{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.page{padding:16px 12px 28px}.topbar,.panel,.result{padding:18px}.summary,.pillars,.row2{grid-template-columns:1fr}.topbar{flex-direction:column;align-items:flex-start}.top-tabs{width:100%}.top-tab{flex:1}}
</style>
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <h1>赛博司命</h1>
      <p>八字分析 · 塔罗占卜</p>
    </div>
    <div class="top-tabs">
      <button class="top-tab active" id="tabBazi" type="button">八字</button>
      <button class="top-tab" id="tabTarot" type="button">塔罗</button>
    </div>
  </header>

  <main class="layout">
    <aside class="card panel">
      <section id="panelBazi">
        <div class="panel-head"><h2>八字输入</h2></div>
        <div class="mode-switch">
          <button class="mode-btn active" id="modeFull" type="button">完整</button>
          <button class="mode-btn" id="modeSimple" type="button">快速</button>
        </div>
        <form id="baziForm" class="stack">
          <div><label for="year">出生年份</label><input id="year" type="number" min="1900" max="2100" value="1990" required></div>
          <div class="row2">
            <div><label for="month">月份</label><input id="month" type="number" min="1" max="12" value="5" required></div>
            <div><label for="day">日期</label><input id="day" type="number" min="1" max="31" value="15" required></div>
          </div>
          <div class="row2">
            <div><label for="hour">时辰</label><input id="hour" type="number" min="0" max="23" value="14" required></div>
            <div><label for="minute">分钟</label><input id="minute" type="number" min="0" max="59" value="0"></div>
          </div>
          <div><label for="gender">性别</label><select id="gender"><option value="男">男</option><option value="女">女</option></select></div>
          <div><label for="location">出生地</label>
            <select id="location">
              <option value="116.4,39.9">北京</option><option value="121.5,31.2">上海</option><option value="113.3,23.1">广州</option><option value="114.1,22.5">深圳</option>
              <option value="104.1,30.7">成都</option><option value="106.6,29.6">重庆</option><option value="120.2,30.3">杭州</option><option value="118.8,32.1">南京</option>
              <option value="114.3,30.6">武汉</option><option value="117.0,36.7">济南</option><option value="113.0,28.2">长沙</option><option value="108.9,34.3">西安</option>
              <option value="126.6,45.8">哈尔滨</option><option value="123.4,41.8">沈阳</option><option value="87.6,43.8">乌鲁木齐</option><option value="91.1,29.7">拉萨</option>
              <option value="custom">自定义</option>
            </select>
          </div>
          <div class="row2 hidden" id="coordRow">
            <div><label for="longitude">经度</label><input id="longitude" type="number" step="0.1" min="73" max="135" value="116.4"></div>
            <div><label for="latitude">纬度</label><input id="latitude" type="number" step="0.1" min="18" max="54" value="39.9"></div>
          </div>
          <button class="submit" id="runBazi" type="submit">开始分析</button>
        </form>
      </section>

      <section id="panelTarot" class="hidden">
        <div class="panel-head"><h2>塔罗输入</h2></div>
        <form id="tarotForm" class="stack">
          <div><label for="tarotQuestion">问题</label><textarea id="tarotQuestion" placeholder="请输入你想占卜的问题"></textarea></div>
          <div><label for="tarotType">类型</label>
            <select id="tarotType">
              <option value="综合">综合</option><option value="爱情">爱情</option><option value="事业">事业</option><option value="财运">财运</option>
              <option value="健康">健康</option><option value="学业">学业</option><option value="人际关系">人际关系</option><option value="其他">其他</option>
            </select>
          </div>
          <div><label for="tarotSpread">牌阵</label>
            <select id="tarotSpread">
              <option value="">自动选择</option>
              <option value="single">单张牌阵</option>
              <option value="three_card">三张牌阵</option>
              <option value="five_card">五张牌阵</option>
              <option value="celtic_cross">凯尔特十字</option>
            </select>
          </div>
          <button class="submit" id="runTarot" type="submit">开始占卜</button>
        </form>
      </section>

      <div class="status" id="statusBox">
        <div id="statusText">处理中...</div>
        <div class="track"><div class="fill" id="progressFill"></div></div>
        <div class="steps" id="stepList"></div>
      </div>
      <div class="error" id="errorBox"></div>
    </aside>

    <section class="card result">
      <div class="placeholder" id="placeholder">
        <div>
          <div class="mark">命</div>
          <h2 id="placeholderTitle">八字分析</h2>
          <p id="placeholderText">输入信息后开始分析</p>
        </div>
      </div>

      <section id="baziResult" class="hidden">
        <div class="result-head"><h2>八字结果</h2><span id="baziModeLabel"></span></div>
        <div class="summary" id="summaryGrid"></div>
        <div class="inline-note hidden" id="timeInfo"></div>
        <div class="pillars" id="baziGrid"></div>
        <div class="divider"></div>
        <div class="two-col">
          <div class="box"><h3>五行分布</h3><div class="bars" id="wuxingChart"></div></div>
          <div class="box"><h3>命局提要</h3><div class="list" id="insightList"></div></div>
        </div>
        <div class="divider"></div>
        <div class="two-col">
          <div class="box">
            <h3>喜用神</h3>
            <div class="tags" id="yongshenTags"></div>
            <div class="info"><p id="yongshenReason">暂无</p></div>
          </div>
          <div class="box">
            <h3>流年运势</h3>
            <div class="list" id="liunianInfo"></div>
          </div>
        </div>
        <div class="divider hidden" id="reportDivider"></div>
        <div class="box hidden" id="reportWrap"><h3>AI 解读</h3><div class="report" id="llmReport"></div></div>
        <div class="divider hidden" id="ragDivider"></div>
        <div class="box hidden" id="ragWrap">
          <h3>RAG 检索</h3>
          <div id="ragStatus"></div>
          <div class="rag-wrap" id="ragQueries"></div>
          <div class="rag-wrap" id="ragDocs" style="margin-top:10px"></div>
        </div>
        <div class="box hidden followup" id="baziFollowupWrap">
          <h3>继续追问</h3>
          <div class="thread" id="baziThread"></div>
          <div class="follow-row">
            <textarea id="baziFollowupInput" placeholder="例如：这个命局的核心短板是什么？"></textarea>
            <button class="send-btn" id="baziFollowupSend" type="button">发送</button>
          </div>
        </div>
      </section>

      <section id="tarotResult" class="hidden">
        <div class="tarot-headline">
          <div>
            <h2 id="tarotSpreadName">塔罗结果</h2>
            <span id="tarotSpreadDesc"></span>
          </div>
        </div>
        <div class="tarot-grid" id="tarotCards"></div>
        <div class="divider hidden" id="tarotReportDivider"></div>
        <div class="box hidden" id="tarotReportWrap"><h3>AI 解读</h3><div class="report" id="tarotReport"></div></div>
        <div class="box hidden followup" id="tarotFollowupWrap">
          <h3>继续追问</h3>
          <div class="thread" id="tarotThread"></div>
          <div class="follow-row">
            <textarea id="tarotFollowupInput" placeholder="例如：接下来最需要注意什么？"></textarea>
            <button class="send-btn" id="tarotFollowupSend" type="button">发送</button>
          </div>
        </div>
      </section>
    </section>
  </main>
</div>

<script>
const $=id=>document.getElementById(id);
const BAZI_FULL=['输入校验','八字排盘','五行分析','格局判断','喜用神推导','流年分析','RAG 检索','AI 解读'];
const BAZI_SIMPLE=['输入校验','八字排盘','五行分析','格局判断','喜用神推导','流年分析'];
const TAROT_STEPS=['选择牌阵','抽牌','单牌解读','综合解读'];
let activeTab='bazi';
let baziMode='full';
let progressTimer=null;
let lastBaziPayload=null;
let lastTarotPayload=null;
let baziConversationId=null;
let tarotConversationId=null;
let baziThreadMessages=[];
let tarotThreadMessages=[];

function switchTab(tab){
  activeTab=tab;
  $('tabBazi').classList.toggle('active',tab==='bazi');
  $('tabTarot').classList.toggle('active',tab==='tarot');
  $('panelBazi').classList.toggle('hidden',tab!=='bazi');
  $('panelTarot').classList.toggle('hidden',tab!=='tarot');
  restoreActiveTab();
}

function setBaziMode(mode){
  baziMode=mode;
  $('modeFull').classList.toggle('active',mode==='full');
  $('modeSimple').classList.toggle('active',mode==='simple');
}

function updateCoords(){
  const v=$('location').value;
  if(v==='custom'){ $('coordRow').classList.remove('hidden'); return; }
  $('coordRow').classList.add('hidden');
  const [lon,lat]=v.split(',');
  $('longitude').value=lon;
  $('latitude').value=lat;
}

function escapeHtml(v){
  return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderMarkdown(text){
  const s=escapeHtml(text||'');
  return s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>')
    .replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>').replace(/^/,'<p>').replace(/$/,'</p>');
}

function showError(message){ $('errorBox').textContent=message; $('errorBox').classList.add('active'); }
function clearError(){ $('errorBox').classList.remove('active'); $('errorBox').textContent=''; }
function setBusy(flag){ $('runBazi').disabled=flag; $('runTarot').disabled=flag; }

function renderThread(containerId, messages){
  const container=$(containerId);
  container.innerHTML=messages.map(item=>`<div class="bubble ${item.role}">${item.role==='assistant'?renderMarkdown(item.content):escapeHtml(item.content)}</div>`).join('');
  container.scrollTop=container.scrollHeight;
}

function startProgress(steps, text){
  clearInterval(progressTimer);
  $('statusBox').classList.add('active');
  $('statusText').textContent=text;
  $('stepList').innerHTML=steps.map((s,i)=>`<div id="step-${i}">${s}</div>`).join('');
  $('progressFill').style.width='0%';
  let i=0;
  progressTimer=setInterval(()=>{
    steps.forEach((_,idx)=>{ const el=$(`step-${idx}`); if(!el) return; el.className=idx<i?'done':idx===i?'active':''; });
    $('progressFill').style.width=`${Math.min((i+1)/steps.length,.96)*100}%`;
    i=Math.min(i+1,steps.length-1);
  },900);
}

function stopProgress(){
  clearInterval(progressTimer);
  progressTimer=null;
  $('progressFill').style.width='100%';
  setTimeout(()=>{
    $('statusBox').classList.remove('active');
    $('stepList').innerHTML='';
    $('progressFill').style.width='0%';
  },450);
}

function pillarValue(p,key){
  const raw=p?.[key];
  return raw&&typeof raw==='object'&&'value' in raw ? raw.value : (raw||'--');
}

function renderBazi(output, mode){
  lastBaziPayload={output,mode};
  const b=output.basic_data||{}, wx=b.wuxing||{}, geju=b.geju||{}, ys=b.yongshen||{}, ln=b.liunian||{}, rag=output.rag_info||{};
  const dm=wx.day_master||{}, balance=wx.balance||{};
  $('placeholder').classList.add('hidden');
  $('tarotResult').classList.add('hidden');
  $('baziResult').classList.remove('hidden');
  $('baziModeLabel').textContent=mode==='full'?'完整':'快速';

  $('summaryGrid').innerHTML=[
    ['日主',dm.day_master||'--',dm.description||''],
    ['格局',geju.geju_type||'--',geju.description||''],
    ['喜用',(ys.yongshen||[]).join('、')||'--',ys.reason||ys.description||''],
    ['检索',rag.status==='success'?'已命中':mode==='simple'?'未启用':(rag.status==='failed'?'失败':'已跳过'),rag.reason||`${rag.doc_count||0} 条片段`]
  ].map(([a,b,c])=>`<div class="summary-item"><span>${escapeHtml(a)}</span><strong>${escapeHtml(b)}</strong><em>${escapeHtml(c)}</em></div>`).join('');

  const ti=output.time_info||{};
  const lines=[];
  if(ti.original_time) lines.push(`原始时间：${escapeHtml(ti.original_time)}`);
  if(ti.dst_applied) lines.push(`夏令时修正：${escapeHtml(ti.dst_corrected_time||'')}`);
  if(ti.true_solar_time_offset_min&&Math.abs(ti.true_solar_time_offset_min)>0.5) lines.push(`真太阳时偏移：${escapeHtml(ti.true_solar_time_offset_min)} 分钟`);
  if(ti.adjusted_time) lines.push(`排盘时间：${escapeHtml(ti.adjusted_time)}`);
  if(lines.length){ $('timeInfo').innerHTML=lines.join('<br>'); $('timeInfo').classList.remove('hidden'); } else { $('timeInfo').classList.add('hidden'); }

  const z=b.bazi||{};
  $('baziGrid').innerHTML=[['年柱',z.year||{}],['月柱',z.month||{}],['日柱',z.day||{}],['时柱',z.hour||{}]]
    .map(([name,p])=>`<div class="pillar"><small>${name}</small><strong>${escapeHtml(pillarValue(p,'tiangan'))}</strong><span>${escapeHtml(pillarValue(p,'dizhi'))}</span></div>`).join('');

  const score=wx.score||{}, total=score.total||1;
  const rows=[['木',score.mu||0,'mu'],['火',score.huo||0,'huo'],['土',score.tu||0,'tu'],['金',score.jin||0,'jin'],['水',score.shui||0,'shui']];
  const max=Math.max(...rows.map(r=>r[1]),1);
  $('wuxingChart').innerHTML=rows.map(([n,v,cls])=>`<div class="bar-row"><div>${n}</div><div class="bar-track"><div class="bar-fill ${cls}" style="width:${Math.max(8,v/max*100)}%"></div></div><div>${((v/total)*100).toFixed(1)}%</div></div>`).join('');

  $('insightList').innerHTML=[
    ['五行平衡',balance.description||wx.description||'暂无说明'],
    ['格局摘要',geju.description||'暂无说明'],
    ['流年提示',ln.analysis||'暂无说明']
  ].map(([t,p])=>`<div class="list-item"><strong>${escapeHtml(t)}</strong><p>${escapeHtml(p)}</p></div>`).join('');

  const good=(ys.yongshen||[]).map(v=>`<span class="tag good">${escapeHtml(v)}</span>`).join('');
  const bad=(ys.jishen||[]).map(v=>`<span class="tag bad">${escapeHtml(v)}</span>`).join('');
  $('yongshenTags').innerHTML=(good||bad)?good+bad:'<span class="tag good">暂无</span>';
  $('yongshenReason').textContent=ys.reason||ys.description||'暂无说明';

  const advice=Array.isArray(ln.advice)?ln.advice.join('；'):'暂无建议';
  $('liunianInfo').innerHTML=
    `<div class="list-item"><strong>年份</strong><p>${escapeHtml(ln.year||'--')} ${escapeHtml(ln.ganzhi||'')}</p></div>`+
    `<div class="list-item"><strong>吉凶</strong><p>${escapeHtml(ln.jixiong?.level||'--')} ${escapeHtml(ln.jixiong?.description||'')}</p></div>`+
    `<div class="list-item"><strong>建议</strong><p>${escapeHtml(advice)}</p></div>`;

  if(output.llm_analysis&&output.llm_analysis.trim()){
    $('reportDivider').classList.remove('hidden');
    $('reportWrap').classList.remove('hidden');
    $('llmReport').innerHTML=renderMarkdown(output.llm_analysis);
  }else{
    $('reportDivider').classList.add('hidden');
    $('reportWrap').classList.add('hidden');
  }

  if(mode==='full'){
    $('ragDivider').classList.remove('hidden');
    $('ragWrap').classList.remove('hidden');
    const statusClass=rag.status==='success'?'rag-status rag-ok':rag.status==='failed'?'rag-status rag-bad':'rag-status rag-skip';
    const statusText=rag.status==='success'?`命中 ${rag.doc_count||0} 条片段`:rag.status==='failed'?(rag.reason||'检索失败'):(rag.reason||'已跳过');
    $('ragStatus').innerHTML=`<div class="${statusClass}">${escapeHtml(statusText)}</div>`;
    $('ragQueries').innerHTML=(rag.queries||[]).length?(rag.queries||[]).map(q=>`<div class="rag-item rag-query"><p>${escapeHtml(q)}</p></div>`).join(''):'';
    $('ragDocs').innerHTML=(rag.documents||[]).length?(rag.documents||[]).map(doc=>{
      const dist=typeof doc.distance==='number'?doc.distance:1, score=Math.max(0,(1-dist)*100);
      return `<div class="rag-item"><p>${escapeHtml((doc.content||'').slice(0,260))}</p><div class="score"><div class="score-row"><span>相关度</span><span>${score.toFixed(0)}%</span></div><div class="score-track"><div class="score-fill" style="width:${score.toFixed(0)}%"></div></div></div></div>`;
    }).join(''):'';
  }else{
    $('ragDivider').classList.add('hidden');
    $('ragWrap').classList.add('hidden');
  }

  $('baziFollowupWrap').classList.toggle('hidden', !baziConversationId);
  renderThread('baziThread', baziThreadMessages);
}

function renderTarot(output){
  lastTarotPayload={output};
  $('placeholder').classList.add('hidden');
  $('baziResult').classList.add('hidden');
  $('tarotResult').classList.remove('hidden');
  const spread=output.spread||{};
  $('tarotSpreadName').textContent=spread.name_cn||'塔罗结果';
  $('tarotSpreadDesc').textContent=spread.description||'';

  $('tarotCards').innerHTML=(output.drawn_cards||[]).map(card=>{
    const reversed=card.orientation==='reversed';
    const keywords=reversed?(card.reversed_keywords||[]):(card.upright_keywords||[]);
    return `<div class="tarot-card">
      <small>${escapeHtml(card.position_name||'')}</small>
      <strong>${escapeHtml(card.card_name_cn||'')}</strong>
      <small>${escapeHtml(card.card_name_en||'')}</small>
      <div class="ori ${reversed?'reversed':'upright'}">${reversed?'逆位':'正位'}</div>
      <div class="kw">${keywords.map(k=>`<span>${escapeHtml(k)}</span>`).join('')}</div>
      <p>${escapeHtml(card.position_description||card.description||'')}</p>
    </div>`;
  }).join('');

  if(output.synthesis&&output.synthesis.trim()){
    $('tarotReportDivider').classList.remove('hidden');
    $('tarotReportWrap').classList.remove('hidden');
    $('tarotReport').innerHTML=renderMarkdown(output.synthesis);
  }else{
    $('tarotReportDivider').classList.add('hidden');
    $('tarotReportWrap').classList.add('hidden');
  }

  $('tarotFollowupWrap').classList.toggle('hidden', !tarotConversationId);
  renderThread('tarotThread', tarotThreadMessages);
}

function restoreActiveTab(){
  const hasBazi=!!lastBaziPayload;
  const hasTarot=!!lastTarotPayload;

  if(activeTab==='bazi'){
    if(hasBazi){
      renderBazi(lastBaziPayload.output,lastBaziPayload.mode);
      return;
    }
  }else{
    if(hasTarot){
      renderTarot(lastTarotPayload.output);
      return;
    }
  }

  $('baziResult').classList.add('hidden');
  $('tarotResult').classList.add('hidden');
  $('baziFollowupWrap').classList.add('hidden');
  $('tarotFollowupWrap').classList.add('hidden');
  $('placeholder').classList.remove('hidden');
  $('placeholderTitle').textContent=activeTab==='bazi'?'八字分析':'塔罗占卜';
  $('placeholderText').textContent=activeTab==='bazi'?'输入信息后开始分析':'输入问题后开始占卜';
}

async function runBazi(){
  clearError(); setBusy(true); startProgress(baziMode==='full'?BAZI_FULL:BAZI_SIMPLE,baziMode==='full'?'完整分析中...':'快速分析中...');
  try{
    baziThreadMessages=[];
    baziConversationId=null;
    const payload={
      year:Number($('year').value),month:Number($('month').value),day:Number($('day').value),hour:Number($('hour').value),
      minute:Number($('minute').value||0),gender:$('gender').value,longitude:Number($('longitude').value),latitude:Number($('latitude').value),analysis_mode:baziMode
    };
    const res=await fetch('/api/v1/bazi/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const json=await res.json().catch(()=>null);
    if(!res.ok) throw new Error((json&&typeof json.detail==='string')?json.detail:`请求失败：${res.status}`);
    const data=json.data||{}, output=data.output||{};
    baziConversationId=data.conversation_id||null;
    renderBazi(output,data.analysis_mode||baziMode);
  }catch(e){ showError(e.message||'分析失败'); }
  finally{ stopProgress(); setBusy(false); }
}

async function runTarot(){
  const question=$('tarotQuestion').value.trim();
  if(!question){ showError('请输入问题'); return; }
  clearError(); setBusy(true); startProgress(TAROT_STEPS,'占卜中...');
  try{
    tarotThreadMessages=[];
    tarotConversationId=null;
    const payload={question,question_type:$('tarotType').value,spread_type:$('tarotSpread').value||null};
    const res=await fetch('/api/v1/tarot/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const json=await res.json().catch(()=>null);
    if(!res.ok) throw new Error((json&&typeof json.detail==='string')?json.detail:`请求失败：${res.status}`);
    const data=json.data||{}, output=data.output||{};
    tarotConversationId=data.conversation_id||null;
    renderTarot(output);
  }catch(e){ showError(e.message||'占卜失败'); }
  finally{ stopProgress(); setBusy(false); }
}

async function sendBaziFollowup(){
  const query=$('baziFollowupInput').value.trim();
  if(!query||!baziConversationId) return;
  clearError();
  $('baziFollowupSend').disabled=true;
  baziThreadMessages.push({role:'user',content:query});
  renderThread('baziThread', baziThreadMessages);
  $('baziFollowupInput').value='';
  try{
    const res=await fetch('/api/v1/bazi/followup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:baziConversationId,query})});
    const json=await res.json().catch(()=>null);
    if(!res.ok) throw new Error((json&&typeof json.detail==='string')?json.detail:`请求失败：${res.status}`);
    const reply=(json.data||{}).response||'';
    baziThreadMessages.push({role:'assistant',content:reply});
    renderThread('baziThread', baziThreadMessages);
  }catch(e){
    showError(e.message||'追问失败');
  }finally{
    $('baziFollowupSend').disabled=false;
  }
}

async function sendTarotFollowup(){
  const query=$('tarotFollowupInput').value.trim();
  if(!query||!tarotConversationId) return;
  clearError();
  $('tarotFollowupSend').disabled=true;
  tarotThreadMessages.push({role:'user',content:query});
  renderThread('tarotThread', tarotThreadMessages);
  $('tarotFollowupInput').value='';
  try{
    const res=await fetch('/api/v1/tarot/followup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversation_id:tarotConversationId,query})});
    const json=await res.json().catch(()=>null);
    if(!res.ok) throw new Error((json&&typeof json.detail==='string')?json.detail:`请求失败：${res.status}`);
    const reply=(json.data||{}).response||'';
    tarotThreadMessages.push({role:'assistant',content:reply});
    renderThread('tarotThread', tarotThreadMessages);
  }catch(e){
    showError(e.message||'追问失败');
  }finally{
    $('tarotFollowupSend').disabled=false;
  }
}

$('tabBazi').addEventListener('click',()=>switchTab('bazi'));
$('tabTarot').addEventListener('click',()=>switchTab('tarot'));
$('modeFull').addEventListener('click',()=>setBaziMode('full'));
$('modeSimple').addEventListener('click',()=>setBaziMode('simple'));
$('location').addEventListener('change',updateCoords);
$('baziForm').addEventListener('submit',e=>{ e.preventDefault(); runBazi(); });
$('tarotForm').addEventListener('submit',e=>{ e.preventDefault(); runTarot(); });
$('baziFollowupSend').addEventListener('click',sendBaziFollowup);
$('tarotFollowupSend').addEventListener('click',sendTarotFollowup);
updateCoords();
</script>
